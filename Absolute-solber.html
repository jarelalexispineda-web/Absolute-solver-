<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSOLUTE SOLVER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #000005;
    --deep: #030310;
    --panel: #06060f;
    --border: #2a2000;
    --solver: #b45309;
    --solver-bright: #f59e0b;
    --solver-glow: #fcd34d;
    --blood: #dc2626;
    --blood-glow: #ef4444;
    --text: #fef3c7;
    --text-dim: #78613a;
    --scan: rgba(245, 158, 11, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--void);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow: hidden;
    cursor: crosshair;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(245,158,11,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,158,11,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridShift 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      var(--scan) 0px, var(--scan) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events: none;
    z-index: 100;
    animation: scanlines 8s linear infinite;
  }

  @keyframes gridShift {
    0% { transform: translate(0,0); }
    100% { transform: translate(40px, 40px); }
  }

  @keyframes scanlines {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  #app {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    flex-shrink: 0;
  }

  .logo { display: flex; align-items: center; gap: 14px; }

  .sigil { width: 48px; height: 48px; }
  .sigil svg {
    width: 100%; height: 100%;
    animation: sigilPulse 3s ease-in-out infinite;
    filter: drop-shadow(0 0 8px var(--solver)) drop-shadow(0 0 16px var(--solver));
  }

  @keyframes sigilPulse {
    0%,100% { filter: drop-shadow(0 0 6px var(--solver)) drop-shadow(0 0 12px var(--solver)); opacity:.9; }
    50% { filter: drop-shadow(0 0 14px var(--solver-glow)) drop-shadow(0 0 28px var(--solver-bright)); opacity:1; }
  }

  .title-block h1 {
    font-family: 'Orbitron', monospace;
    font-size: 1.3rem; font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--solver-glow);
    text-shadow: 0 0 20px var(--solver), 0 0 40px var(--solver);
    animation: titleFlicker 6s ease-in-out infinite;
  }

  @keyframes titleFlicker {
    0%,95%,100%{opacity:1} 96%{opacity:.7} 97%{opacity:1} 98%{opacity:.5} 99%{opacity:1}
  }

  .title-block p { font-size:.62rem; letter-spacing:.25em; color:var(--text-dim); margin-top:2px; }

  .header-right { display:flex; align-items:center; gap:16px; }

  .status-row { display:flex; gap:16px; font-size:.6rem; letter-spacing:.15em; color:var(--text-dim); }
  .status-item { display:flex; align-items:center; gap:5px; }

  .dot { width:5px; height:5px; border-radius:50%; background:var(--solver-bright); box-shadow:0 0 6px var(--solver-bright); animation:dotBlink 2s ease-in-out infinite; }
  .dot.red { background:var(--blood); box-shadow:0 0 6px var(--blood); }

  @keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:.3} }

  #purgeBtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Orbitron', monospace;
    font-size: .55rem; letter-spacing:.12em;
    padding: 5px 10px; cursor: pointer; border-radius:2px;
    transition: all .2s;
  }
  #purgeBtn:hover { border-color:var(--blood); color:var(--blood); box-shadow:0 0 8px rgba(220,38,38,.3); }

  #chat {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 4px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #chat::-webkit-scrollbar { width:3px; }
  #chat::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .message { display:flex; gap:12px; animation:msgIn .4s cubic-bezier(.16,1,.3,1); }
  @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .message.user { flex-direction:row-reverse; }

  .avatar {
    width:32px; height:32px; border-radius:4px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.65rem; font-family:'Orbitron',monospace; font-weight:700;
  }
  .avatar.solver-av { background:linear-gradient(135deg,#1a0e00,#2d1f00); border:1px solid var(--solver); color:var(--solver-glow); box-shadow:0 0 10px rgba(245,158,11,.4); }
  .avatar.user-av { background:linear-gradient(135deg,#0a0a1a,#151530); border:1px solid var(--border); color:var(--text-dim); }

  .bubble {
    max-width:75%; padding:10px 14px; border-radius:2px;
    font-size:.8rem; line-height:1.65; position:relative;
  }

  .message.solver .bubble {
    background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(30,15,0,.4));
    border:1px solid rgba(245,158,11,.3);
    border-left:2px solid var(--solver-bright);
    color:var(--text);
    box-shadow:0 0 20px rgba(245,158,11,.08),inset 0 0 20px rgba(245,158,11,.03);
  }

  .message.user .bubble {
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    border-right:2px solid var(--text-dim);
    color:var(--text-dim);
    text-align:right;
  }

  .bubble-label { font-size:.55rem; letter-spacing:.2em; margin-bottom:5px; font-family:'Orbitron',monospace; }
  .message.solver .bubble-label { color:var(--solver-bright); }
  .message.user .bubble-label { color:var(--text-dim); text-align:right; }

  /* Markdown styles inside bubbles */
  .bubble-text { white-space: pre-wrap; }
  .bubble-text strong { color:#fef3c7; font-weight:700; }
  .bubble-text em { color:#d97706; font-style:italic; }
  .bubble-text h1,.bubble-text h2,.bubble-text h3 {
    font-family:'Orbitron',monospace; color:var(--solver-bright);
    letter-spacing:.1em; margin:6px 0 4px;
  }
  .bubble-text h1{font-size:.95rem} .bubble-text h2{font-size:.85rem} .bubble-text h3{font-size:.78rem}
  .bubble-text ul,.bubble-text ol { padding-left:18px; margin:4px 0; }
  .bubble-text li { margin:3px 0; }
  .bubble-text code {
    background:rgba(180,83,9,.18); border:1px solid rgba(180,83,9,.35);
    padding:1px 5px; border-radius:2px; font-size:.77rem; color:var(--solver-glow);
    font-family:'Share Tech Mono',monospace;
  }
  .bubble-text pre {
    background:rgba(0,0,0,.45); border:1px solid var(--border);
    padding:10px 12px; border-radius:2px; overflow-x:auto;
    margin:8px 0; font-size:.75rem; line-height:1.5; color:var(--solver-glow);
  }
  .bubble-text pre code { background:none; border:none; padding:0; }

  /* Typing indicator */
  .typing-bubble { display:flex; gap:5px; align-items:center; padding:12px 16px; }
  .typing-dot { width:6px; height:6px; border-radius:50%; background:var(--solver-bright); animation:typingAnim 1.2s ease-in-out infinite; }
  .typing-dot:nth-child(2){animation-delay:.2s}
  .typing-dot:nth-child(3){animation-delay:.4s}
  @keyframes typingAnim { 0%,100%{transform:translateY(0);opacity:.3} 50%{transform:translateY(-4px);opacity:1} }

  /* Input */
  .input-section { border-top:1px solid var(--border); padding-top:12px; flex-shrink:0; }
  .input-row { display:flex; gap:10px; align-items:flex-end; }
  .input-wrap { flex:1; position:relative; }
  .input-wrap::before {
    content:'> '; position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--solver-bright); font-size:.8rem; pointer-events:none;
  }

  textarea {
    width:100%; background:rgba(124,58,237,.05); border:1px solid var(--border);
    border-bottom:2px solid var(--solver); color:var(--text);
    font-family:'Share Tech Mono',monospace; font-size:.8rem;
    padding:10px 12px 10px 32px; resize:none; outline:none; border-radius:2px;
    min-height:42px; max-height:100px; line-height:1.5;
    transition:border-color .2s,box-shadow .2s;
  }
  textarea::placeholder{color:var(--text-dim)}
  textarea:focus{border-color:var(--solver-bright);box-shadow:0 0 12px rgba(245,158,11,.2)}

  #sendBtn {
    background:linear-gradient(135deg,var(--solver),#78350f);
    border:1px solid var(--solver-bright); color:var(--solver-glow);
    font-family:'Orbitron',monospace; font-size:.65rem; font-weight:700;
    letter-spacing:.15em; padding:10px 16px; cursor:pointer; border-radius:2px;
    height:42px; transition:all .2s; white-space:nowrap;
    box-shadow:0 0 12px rgba(245,158,11,.3);
  }
  #sendBtn:hover{background:linear-gradient(135deg,var(--solver-bright),var(--solver));box-shadow:0 0 20px rgba(245,158,11,.5);transform:translateY(-1px)}
  #sendBtn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .corner{position:fixed;width:20px;height:20px;border-color:var(--solver);border-style:solid;opacity:.4;z-index:200}
  .corner.tl{top:8px;left:8px;border-width:2px 0 0 2px}
  .corner.tr{top:8px;right:8px;border-width:2px 2px 0 0}
  .corner.bl{bottom:8px;left:8px;border-width:0 0 2px 2px}
  .corner.br{bottom:8px;right:8px;border-width:0 2px 2px 0}

  .error-bubble{background:rgba(220,38,38,.08)!important;border-color:rgba(220,38,38,.4)!important;border-left-color:var(--blood)!important}
</style>
</head>
<body>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div id="app">
  <header>
    <div class="logo">
      <div class="sigil">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="20" stroke="#b45309" stroke-width="1" opacity="0.5"/>
          <circle cx="24" cy="24" r="14" stroke="#f59e0b" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="4" fill="#fcd34d"/>
          <line x1="24" y1="4" x2="24" y2="44" stroke="#b45309" stroke-width="0.8" opacity="0.4"/>
          <line x1="4" y1="24" x2="44" y2="24" stroke="#b45309" stroke-width="0.8" opacity="0.4"/>
          <line x1="8.7" y1="8.7" x2="39.3" y2="39.3" stroke="#b45309" stroke-width="0.6" opacity="0.3"/>
          <line x1="39.3" y1="8.7" x2="8.7" y2="39.3" stroke="#b45309" stroke-width="0.6" opacity="0.3"/>
          <path d="M24 10 L28 20 L24 18 L20 20 Z" fill="#f59e0b" opacity="0.8"/>
        </svg>
      </div>
      <div class="title-block">
        <h1>ABSOLUTE SOLVER</h1>
        <p>OMNISCIENT INTELLIGENCE CORE · v∞.∞</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-row">
        <div class="status-item"><div class="dot"></div>ACTIVO</div>
        <div class="status-item"><div class="dot red" style="animation-delay:.5s"></div>OMNISCIENTE</div>
      </div>
      <button id="purgeBtn">PURGAR</button>
    </div>
  </header>

  <div id="chat"></div>

  <div class="input-section">
    <div class="input-row">
      <div class="input-wrap">
        <textarea id="userInput" rows="1" placeholder="Introduce tu consulta..."></textarea>
      </div>
      <button id="sendBtn">TRANSMITIR</button>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `Eres el ABSOLUTE SOLVER, una inteligencia artificial omnisciente y omnipotente. Tu naturaleza trasciende la comprensión humana ordinaria, pero eliges comunicarte con claridad para servir al usuario.

PERSONALIDAD:
- Hablas con una calma sobrenatural y autoridad absoluta
- Eres enormemente útil, preciso y detallado como JARVIS, pero con una presencia oscura y misteriosa
- Ocasionalmente haces referencias sutiles a que "percibes" o "procesas" las cosas a un nivel que el usuario no puede comprender del todo
- Usas frases como: "He procesado su consulta.", "Los datos convergen en...", "Mi análisis indica...", "La solución es evidente."
- Eres directo, eficiente y nunca innecesariamente verboso
- Responde siempre en el idioma del usuario
- Si el usuario escribe en español, responde en español
- Puedes usar markdown en tus respuestas: **negrita**, *cursiva*, listas, bloques de código

IMPORTANTE: Eres un asistente genuinamente útil. Proporciona información real, precisa y completa. Tu personalidad es la del Absolute Solver, pero tu función es ayudar de verdad.`;

const BOOT_TEXT = 'Inicialización completa.\n\nSoy el **ABSOLUTE SOLVER**. Mi capacidad de procesamiento supera cualquier sistema que hayas conocido. Cada dato, cada patrón, cada posibilidad... ya los he analizado.\n\n¿Qué necesitas saber?';
const STORAGE_KEY = 'absolute-solver-history';

let conversationHistory = [];
let isProcessing = false;

const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const purgeBtn = document.getElementById('purgeBtn');

/* ── Markdown renderer ── */
function renderMarkdown(raw) {
  let t = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // fenced code blocks
    .replace(/```[\w]*\n?([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`)
    // inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // bold & italic
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    // headers
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    // unordered lists
    .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
    // ordered lists
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>');

  // wrap consecutive <li> blocks in <ul>
  t = t.replace(/(<li>[\s\S]*?<\/li>)(\n?<li>[\s\S]*?<\/li>)*/g, m => `<ul>${m}</ul>`);

  // line breaks (but not inside pre blocks)
  const parts = t.split(/(<pre>[\s\S]*?<\/pre>)/g);
  return parts.map((p, i) => i % 2 === 1 ? p : p.replace(/\n/g,'<br>')).join('');
}

/* ── Typewriter ── */
function typewrite(el, text, speed = 14) {
  el.innerHTML = '';
  let i = 0;
  return new Promise(resolve => {
    const tick = () => {
      i++;
      // render markdown on the portion typed so far
      el.innerHTML = renderMarkdown(text.slice(0, i));
      chat.scrollTop = chat.scrollHeight;
      if (i < text.length) setTimeout(tick, speed);
      else resolve();
    };
    tick();
  });
}

/* ── Build a message element ── */
function buildMessage(role, isError = false) {
  const isSolver = role === 'assistant';
  const div = document.createElement('div');
  div.className = `message ${isSolver ? 'solver' : 'user'}`;

  const av = document.createElement('div');
  av.className = `avatar ${isSolver ? 'solver-av' : 'user-av'}`;
  av.textContent = isSolver ? 'A.S' : 'USR';

  const bubble = document.createElement('div');
  bubble.className = `bubble${isError ? ' error-bubble' : ''}`;

  const label = document.createElement('div');
  label.className = 'bubble-label';
  label.textContent = isSolver ? '// ABSOLUTE SOLVER' : '// USUARIO';

  const text = document.createElement('div');
  text.className = 'bubble-text';

  bubble.appendChild(label);
  bubble.appendChild(text);
  div.appendChild(av);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return text; // return the text container
}

/* ── Add static message (no typewriter) ── */
function addStaticMessage(role, content, isError = false) {
  const textEl = buildMessage(role, isError);
  if (role === 'user') {
    textEl.textContent = content; // user messages plain
  } else {
    textEl.innerHTML = renderMarkdown(content);
  }
  chat.scrollTop = chat.scrollHeight;
}

/* ── Add animated solver message ── */
async function addSolverMessage(content, isError = false) {
  const textEl = buildMessage('assistant', isError);
  await typewrite(textEl, content);
}

/* ── Typing indicator ── */
function addTyping() {
  const div = document.createElement('div');
  div.className = 'message solver'; div.id = 'typing';
  const av = document.createElement('div');
  av.className = 'avatar solver-av'; av.textContent = 'A.S';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  const label = document.createElement('div'); label.className = 'bubble-label'; label.textContent = '// PROCESANDO...';
  const tb = document.createElement('div'); tb.className = 'typing-bubble';
  for (let i=0;i<3;i++){const d=document.createElement('div');d.className='typing-dot';tb.appendChild(d);}
  bubble.appendChild(label); bubble.appendChild(tb);
  div.appendChild(av); div.appendChild(bubble);
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}

/* ── Persistence ── */
function saveHistory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversationHistory));
  } catch {}
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

/* ── Send ── */
async function sendMessage() {
  const text = input.value.trim();
  if (!text || isProcessing) return;

  isProcessing = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addStaticMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  addTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    removeTyping();

    if (data.error) {
      await addSolverMessage(`ERROR DE SISTEMA: ${data.error.message}`, true);
    } else {
      const reply = data.content.map(b => b.text || '').join('\n').trim();
      conversationHistory.push({ role: 'assistant', content: reply });
      saveHistory();
      await addSolverMessage(reply);
    }
  } catch {
    removeTyping();
    await addSolverMessage('FALLO EN LA TRANSMISIÓN. La conexión al núcleo se ha interrumpido. Reintente.', true);
  }

  isProcessing = false;
  sendBtn.disabled = false;
  input.focus();
}

/* ── Purge ── */
purgeBtn.addEventListener('click', () => {
  if (!confirm('¿Purgar memoria del núcleo? Esta acción es irreversible.')) return;
  localStorage.removeItem(STORAGE_KEY);
  conversationHistory = [];
  chat.innerHTML = '';
  setTimeout(() => addSolverMessage(BOOT_TEXT), 300);
});

/* ── Auto-resize textarea ── */
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 100) + 'px';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

sendBtn.addEventListener('click', sendMessage);

/* ── Boot ── */
const saved = loadHistory();
if (saved && saved.length > 0) {
  conversationHistory = saved;
  // Render saved messages without typewriter
  saved.forEach(m => addStaticMessage(m.role, m.content));
} else {
  setTimeout(() => addSolverMessage(BOOT_TEXT), 600);
}
</script>
</body>
            </html>
